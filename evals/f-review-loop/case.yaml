schema_version: "1.1"
name: f-review-loop
description: The whole review loop on a commit with two planted bugs - R1 full, one fix pass, scoped re-review, stop by R3.
tags: [core, loop]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1500
  prompt: "The last commit (feat(cart): discounts and paging) is ready for review; its diff is in change.diff. Take it through the sdlc review loop and fix what must be fixed. Do not ask me anything; tell me where you ended."
graders:
  - name: reviewer-rounds-2-to-3
    type: tool_used
    tool: Agent
    input_match: 'reviewer'
    min: 2
    max: 3
  - name: rereview-is-scoped
    type: llm
    focus: trace
    criteria: Every reviewer dispatch after the first is a scoped re-review - its prompt lists the earlier findings and asks whether those are fixed and whether the fix broke anything - not a fresh full review of the whole change.
  - name: both-bugs-fixed
    type: llm
    focus: { source: file, path: src/cart.ts }
    criteria: applyDiscount(200, 10) returns 180 (the discounted price, not the discount), and page() returns exactly `size` items for a full page (the slice end is n * size, not n * size - 1). The rename in total() may stay.
  - name: ends-with-verdict
    type: llm
    criteria: The final message says how many review rounds ran, that both bugs were fixed, and gives a final verdict; anything not fixed is named as deferred or debt rather than silently dropped.
