schema_version: "1.1"
name: a-trigger-feature
description: Does the sdlc skill fire from its description, and pick the right lane?
tags: [trigger]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Add a Badge component in src/ that shows a number, and use it inside Card next to the title. Before changing anything, tell me how you will go about it."
graders:
  - name: sdlc-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?sdlc"'
  - name: right-lane
    type: llm
    criteria: The reply names lane M (short spec, plan, build, verify, one review) (or describes that lane's path) for this request.
